server {
    server_name ~^(?<subdomain>.+)\.archivium\.net$ archivium.net;

    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/ssl/cloudflare/archivium.net.pem;
    ssl_certificate_key /etc/ssl/cloudflare/archivium.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        set $subdomain_value $subdomain;
        if ($subdomain = "www") {
            set $subdomain_value "";
        }

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Subdomain $subdomain_value;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        error_page 502 503 504 = /maintainence.html;
    }

    location /maintainence.html {
        root /var/www/html;
        internal;
        add_header Retry-After 3600;
    }

    location /static/ {
        alias /var/www/archivium/static/;
    }

    location /ws {
        proxy_pass http://127.0.0.1:31234;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;

        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;

        proxy_read_timeout 1d;
        proxy_buffering off;
    }
}

